services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data            # index + SQLite built by `make index`
      - ./models:/app/models        # LoRA adapter from `make train`
      - hf-cache:/app/.cache/huggingface
    environment:
      CIA_CONFIG: /app/configs/config.yaml

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns

volumes:
  hf-cache:
